[project]
name = "backend"
version = "0.1.0"
description = "API de Cuentas Claras"
readme = "README.md"
authors = [
    { name = "SantiagoAA24", email = "santiago.acevedo.m24@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.161.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
