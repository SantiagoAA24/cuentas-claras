<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0" rel="stylesheet">
<style>
body{margin:0;background:#EFE6D6;color:#2B1D12;font-family:'Nunito',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#7A4A1F}a:hover{color:#2B1D12}
.material-symbols-rounded{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga'}
button{-webkit-tap-highlight-color:transparent}
input::placeholder{color:#9C8A76}
</style>
</helmet>
<section style="padding:48px;display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start">
<sc-for list="{{ frames }}" as="f" hint-placeholder-count="3">
  <div id="{{ f.id }}" style="display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;align-items:center;gap:10px">
      <span style="height:28px;padding:0 10px;border-radius:8px;background:#5A3414;color:#FFC72C;font:800 14px 'JetBrains Mono',monospace;display:flex;align-items:center">{{ f.id }}</span>
      <span style="font-size:17px;font-weight:800;color:#5A3414">{{ f.title }}</span>
    </div>

    <div style="position:relative;width:390px;height:844px;background:#FFF8EC;border-radius:32px;overflow:hidden;box-shadow:0 12px 40px rgba(90,52,20,.22);display:flex;flex-direction:column">
      <div style="height:28px;flex-shrink:0;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:13px;font-weight:800">
        <span>12:55</span>
        <span style="display:flex;gap:4px"><span class="material-symbols-rounded" style="font-size:16px">signal_cellular_alt</span><span class="material-symbols-rounded" style="font-size:16px">wifi</span><span class="material-symbols-rounded" style="font-size:16px">battery_5_bar</span></span>
      </div>
      <div style="height:64px;flex-shrink:0;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px;border-bottom:1px solid #EFE3CF">
        <div style="display:flex;flex-direction:column;gap:3px">
          <span style="font-size:20px;font-weight:900;color:#5A3414;line-height:1">Cuentas Claras</span>
          <div style="display:flex;gap:10px;font-size:12px;font-weight:800;color:#1F7A3D">
            <span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:#1F7A3D"></span>En línea</span>
            <span style="display:flex;align-items:center;gap:4px"><span class="material-symbols-rounded" style="font-size:14px">print</span>Impresora</span>
          </div>
        </div>
        <button style="width:48px;height:48px;border:0;border-radius:12px;background:transparent;color:#5A3414;display:flex;align-items:center;justify-content:center;cursor:pointer"><span class="material-symbols-rounded" style="font-size:28px">settings</span></button>
      </div>

      <div style="flex-shrink:0;padding:12px 16px 0;display:flex;flex-direction:column;gap:10px">
        <div style="height:52px;background:#fff;border:2px solid #E3D3BA;border-radius:12px;display:flex;align-items:center;gap:8px;padding:0 12px">
          <span class="material-symbols-rounded" style="font-size:24px;color:#7A4A1F">search</span>
          <input value="{{ f.query }}" onChange="{{ f.onQuery }}" placeholder="Buscar producto" style="flex:1;min-width:0;border:0;outline:none;background:transparent;font:600 18px 'Nunito',sans-serif;color:#2B1D12"></input>
        </div>
        <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none">
          <sc-for list="{{ f.cats }}" as="c" hint-placeholder-count="4">
            <button onClick="{{ c.onClick }}" style="flex-shrink:0;height:44px;padding:0 18px;border-radius:999px;border:2px solid {{ c.border }};background:{{ c.bg }};color:#2B1D12;font:800 16px 'Nunito',sans-serif;cursor:pointer">{{ c.label }}</button>
          </sc-for>
        </div>
      </div>

      <div style="flex:1;min-height:0;overflow-y:auto;padding:0 16px 168px;scrollbar-width:none">
        <div style="background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(90,52,20,.08);overflow:hidden;display:flex;flex-direction:column">
          <sc-for list="{{ f.list }}" as="p" hint-placeholder-count="8">
            <div style="display:flex;align-items:center;gap:8px;padding:0 8px 0 0;border-bottom:1px solid #EFE3CF;background:{{ p.rowBg }}">
              <button onClick="{{ p.onEdit }}" style="flex:1;min-width:0;min-height:68px;border:0;background:transparent;padding:10px 0 10px 14px;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;font-family:'Nunito',sans-serif;opacity:{{ p.opacity }}">
                <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
                  <span style="font-size:17px;font-weight:800;color:#2B1D12;line-height:1.2">{{ p.name }}</span>
                  <span style="font-size:14px;font-weight:700;color:#6B5B4B">{{ p.meta }}</span>
                </span>
                <span style="font-size:18px;font-weight:900;color:#5A3414;font-variant-numeric:tabular-nums">{{ p.price }}</span>
              </button>
              <button onClick="{{ p.onToggle }}" aria-label="Activo" style="width:64px;height:48px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0">
                <span style="width:52px;height:32px;border-radius:999px;background:{{ p.trackBg }};border:2px solid {{ p.trackBorder }};box-sizing:border-box;display:flex;align-items:center;justify-content:{{ p.knobSide }};padding:0 3px">
                  <span style="width:22px;height:22px;border-radius:50%;background:{{ p.knobBg }};box-shadow:0 1px 3px rgba(43,29,18,.25)"></span>
                </span>
              </button>
            </div>
          </sc-for>
        </div>
        <sc-if value="{{ f.noResults }}" hint-placeholder-val="{{ false }}">
          <div style="padding:40px 16px;text-align:center;font-size:16px;font-weight:700;color:#6B5B4B">No encontramos productos con esa búsqueda.</div>
        </sc-if>
      </div>

      <button onClick="{{ f.onNew }}" aria-label="Agregar producto" style="position:absolute;right:16px;bottom:88px;width:64px;height:64px;border:0;border-radius:50%;background:#F5B400;color:#2B1D12;box-shadow:0 6px 16px rgba(90,52,20,.3);display:flex;align-items:center;justify-content:center;cursor:pointer" style-active="transform:scale(.95)"><span class="material-symbols-rounded" style="font-size:36px">add</span></button>

      <div style="position:absolute;left:0;right:0;bottom:0;height:72px;background:#fff;border-top:1px solid #EFE3CF;display:grid;grid-template-columns:repeat(3,1fr);padding:6px;gap:6px;box-sizing:border-box">
        <button style="border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:'Nunito',sans-serif">
          <span style="width:56px;height:32px;display:flex;align-items:center;justify-content:center"><span class="material-symbols-rounded" style="font-size:24px;color:#6B5B4B">point_of_sale</span></span>
          <span style="font-size:14px;font-weight:800;color:#6B5B4B">Vender</span>
        </button>
        <button style="border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:'Nunito',sans-serif">
          <span style="width:56px;height:32px;display:flex;align-items:center;justify-content:center"><span class="material-symbols-rounded" style="font-size:24px;color:#6B5B4B">receipt_long</span></span>
          <span style="font-size:14px;font-weight:800;color:#6B5B4B">Historial</span>
        </button>
        <button style="border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:'Nunito',sans-serif">
          <span style="width:56px;height:32px;border-radius:999px;background:#F5B400;display:flex;align-items:center;justify-content:center"><span class="material-symbols-rounded" style="font-size:24px;color:#2B1D12">inventory_2</span></span>
          <span style="font-size:14px;font-weight:900;color:#2B1D12">Productos</span>
        </button>
      </div>

      <sc-if value="{{ f.sheet }}" hint-placeholder-val="{{ false }}">
        <div onClick="{{ f.close }}" style="position:absolute;inset:0;background:rgba(43,29,18,.55)"></div>
        <div style="position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:12px 12px 0 0;box-shadow:0 -8px 24px rgba(43,29,18,.2);padding:8px 16px 16px;display:flex;flex-direction:column;gap:14px">
          <div style="display:flex;justify-content:center"><span style="width:40px;height:5px;border-radius:999px;background:#E3D3BA"></span></div>
          <div style="display:flex;align-items:center;justify-content:space-between">
            <span style="font-size:24px;font-weight:900;color:#5A3414">{{ f.sheetTitle }}</span>
            <button onClick="{{ f.close }}" style="width:48px;height:48px;border:0;border-radius:12px;background:#F6ECDD;color:#5A3414;display:flex;align-items:center;justify-content:center;cursor:pointer"><span class="material-symbols-rounded" style="font-size:26px">close</span></button>
          </div>

          <div style="display:flex;flex-direction:column;gap:6px">
            <label style="font-size:15px;font-weight:800;color:#5A3414">Nombre</label>
            <input value="{{ f.name }}" onChange="{{ f.onName }}" placeholder="Ej. Arepa de huevo" style="height:56px;border:2px solid {{ f.nameBorder }};border-radius:12px;padding:0 16px;font:700 18px 'Nunito',sans-serif;color:#2B1D12;outline:none" style-focus="box-shadow:0 0 0 4px rgba(245,180,0,.35)"></input>
            <sc-if value="{{ f.nameErr }}" hint-placeholder-val="{{ false }}">
              <span style="font-size:14px;font-weight:800;color:#C0322B;display:flex;align-items:center;gap:4px"><span class="material-symbols-rounded" style="font-size:18px">error</span>El nombre es obligatorio</span>
            </sc-if>
          </div>

          <div style="display:flex;flex-direction:column;gap:6px">
            <label style="font-size:15px;font-weight:800;color:#5A3414">Precio</label>
            <div style="height:60px;border:2px solid {{ f.priceBorder }};border-radius:12px;display:flex;align-items:center;gap:4px;padding:0 16px">
              <span style="font-size:26px;font-weight:900;color:#6B5B4B">$</span>
              <input inputmode="numeric" value="{{ f.priceText }}" onChange="{{ f.onPrice }}" placeholder="0" style="flex:1;min-width:0;border:0;outline:none;background:transparent;font:900 26px 'Nunito',sans-serif;font-variant-numeric:tabular-nums;color:#2B1D12"></input>
            </div>
            <sc-if value="{{ f.priceErr }}" hint-placeholder-val="{{ false }}">
              <span style="font-size:14px;font-weight:800;color:#C0322B;display:flex;align-items:center;gap:4px"><span class="material-symbols-rounded" style="font-size:18px">error</span>El precio debe ser mayor a $0</span>
            </sc-if>
          </div>

          <div style="display:flex;flex-direction:column;gap:6px">
            <label style="font-size:15px;font-weight:800;color:#5A3414">Categoría</label>
            <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:#FFF8EC;border:1px solid #EFE3CF;border-radius:12px;padding:4px">
              <sc-for list="{{ f.formCats }}" as="c" hint-placeholder-count="3">
                <button onClick="{{ c.onClick }}" style="height:48px;border:0;border-radius:10px;background:{{ c.bg }};box-shadow:{{ c.shadow }};color:#2B1D12;font:800 16px 'Nunito',sans-serif;cursor:pointer">{{ c.label }}</button>
              </sc-for>
            </div>
          </div>

          <button onClick="{{ f.onActive }}" style="min-height:60px;border:1px solid #EFE3CF;border-radius:12px;background:#fff;display:flex;align-items:center;gap:12px;padding:8px 12px 8px 16px;cursor:pointer;text-align:left;font-family:'Nunito',sans-serif">
            <span style="flex:1;display:flex;flex-direction:column">
              <span style="font-size:17px;font-weight:800;color:#2B1D12">Activo</span>
              <span style="font-size:14px;font-weight:700;color:#6B5B4B">{{ f.activeHint }}</span>
            </span>
            <span style="width:52px;height:32px;border-radius:999px;background:{{ f.trackBg }};border:2px solid {{ f.trackBorder }};box-sizing:border-box;display:flex;align-items:center;justify-content:{{ f.knobSide }};padding:0 3px">
              <span style="width:22px;height:22px;border-radius:50%;background:{{ f.knobBg }};box-shadow:0 1px 3px rgba(43,29,18,.25)"></span>
            </span>
          </button>

          <button onClick="{{ f.onSave }}" style="height:60px;border:0;border-radius:12px;background:#F5B400;color:#2B1D12;box-shadow:0 2px 0 #C99400;font:900 20px 'Nunito',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;margin-top:2px"><span class="material-symbols-rounded" style="font-size:24px">check</span>Guardar</button>
        </div>
      </sc-if>
    </div>
  </div>
</sc-for>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
const cop = n => '$' + String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const dots = s => s ? String(Number(s)).replace(/\B(?=(\d{3})+(?!\d))/g, '.') : '';
const CATS = ['Todas', 'Arepas', 'Bebidas', 'Adicionales'];
const BASE = [
  ['Arepa de queso', 'Arepas', 5000, true], ['Arepa rellena de carne', 'Arepas', 9000, true],
  ['Arepa de huevo', 'Arepas', 7000, true], ['Arepa mixta', 'Arepas', 11000, true],
  ['Arepa de choclo', 'Arepas', 6000, true], ['Gaseosa', 'Bebidas', 3000, true],
  ['Jugo natural', 'Bebidas', 4500, true], ['Café', 'Bebidas', 2000, true],
  ['Chocolate', 'Bebidas', 3000, false], ['Queso extra', 'Adicionales', 1500, false]
].map(([name, cat, price, active], i) => ({ id: i, name, cat, price, active }));
const blankForm = { editId: null, name: '', price: '', cat: 'Arepas', active: true, tried: false };
const INIT = {
  '5a': { products: BASE, cat: 'Todas', q: '', sheet: false, form: blankForm },
  '5b': { products: BASE, cat: 'Todas', q: '', sheet: true, form: { ...blankForm, tried: true } },
  '5c': { products: BASE, cat: 'Todas', q: '', sheet: true, form: { editId: 2, name: 'Arepa de huevo', price: '7000', cat: 'Arepas', active: true, tried: false } }
};
const toggle = (on, s) => ({
  [s + 'trackBg']: on ? '#1F7A3D' : '#E3D3BA', [s + 'trackBorder']: on ? '#1F7A3D' : '#CDB99C',
  [s + 'knobSide']: on ? 'flex-end' : 'flex-start', [s + 'knobBg']: '#fff'
});

class Component extends DCLogic {
  state = INIT;
  frame(id, title) {
    const f = this.state[id], fm = f.form;
    const set = p => this.setState(st => ({ [id]: { ...st[id], ...p } }));
    const setF = p => this.setState(st => ({ [id]: { ...st[id], form: { ...st[id].form, ...p } } }));
    const q = f.q.trim().toLowerCase();
    const list = f.products.filter(p => (f.cat === 'Todas' || p.cat === f.cat) && (!q || p.name.toLowerCase().includes(q)));
    const nameErr = fm.tried && !fm.name.trim();
    const priceErr = fm.tried && !(Number(fm.price) > 0);
    const ft = toggle(fm.active, '');
    return {
      id, title, query: f.q, onQuery: e => set({ q: e.target.value }),
      cats: CATS.map(c => ({ label: c, onClick: () => set({ cat: c }), bg: f.cat === c ? '#F5B400' : '#fff', border: f.cat === c ? '#F5B400' : '#E3D3BA' })),
      list: list.map(p => {
        const t = toggle(p.active, '');
        return {
          name: p.name, price: cop(p.price), meta: p.cat + (p.active ? '' : ' · Inactivo · no aparece en Vender'),
          opacity: p.active ? 1 : 0.5, rowBg: p.active ? '#fff' : '#FAF5EC', ...t,
          onToggle: () => set({ products: f.products.map(x => x.id === p.id ? { ...x, active: !x.active } : x) }),
          onEdit: () => set({ sheet: true, form: { editId: p.id, name: p.name, price: String(p.price), cat: p.cat, active: p.active, tried: false } })
        };
      }),
      noResults: list.length === 0,
      onNew: () => set({ sheet: true, form: blankForm }),
      sheet: f.sheet, close: () => set({ sheet: false }),
      sheetTitle: fm.editId === null ? 'Nuevo producto' : 'Editar producto',
      name: fm.name, onName: e => setF({ name: e.target.value }),
      priceText: dots(fm.price), onPrice: e => setF({ price: e.target.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 7) }),
      nameErr, priceErr, nameBorder: nameErr ? '#C0322B' : '#E3D3BA', priceBorder: priceErr ? '#C0322B' : '#E3D3BA',
      formCats: CATS.slice(1).map(c => ({ label: c, onClick: () => setF({ cat: c }), bg: fm.cat === c ? '#F5B400' : 'transparent', shadow: fm.cat === c ? '0 1px 3px rgba(90,52,20,.2)' : 'none' })),
      onActive: () => setF({ active: !fm.active }),
      activeHint: fm.active ? 'Se muestra en la pantalla de venta' : 'Oculto en la pantalla de venta',
      ...ft,
      onSave: () => {
        if (!fm.name.trim() || !(Number(fm.price) > 0)) return setF({ tried: true });
        const item = { name: fm.name.trim(), price: Number(fm.price), cat: fm.cat, active: fm.active };
        const products = fm.editId === null
          ? [...f.products, { ...item, id: Date.now() }]
          : f.products.map(x => x.id === fm.editId ? { ...x, ...item } : x);
        set({ products, sheet: false });
      }
    };
  }
  renderVals() {
    return { frames: [this.frame('5a', 'Lista de productos'), this.frame('5b', 'Nuevo producto · validaciones'), this.frame('5c', 'Editar producto')] };
  }
}
</script>
</body>
</html>
